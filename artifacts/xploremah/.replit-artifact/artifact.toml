kind = "web"
previewPath = "/"
title = "XploreMah"
description = "A premium eco-tourism booking platform for discovering hidden-gem destinations across Maharashtra while directly supporting local hosts, guides, and village communities."
version = "1.0.0"
id = "artifacts/xploremah"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23769

[services.development]
run = "pnpm --filter @workspace/xploremah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xploremah", "run", "build" ]
serve = "static"
publicDir = "artifacts/xploremah/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23769"
BASE_PATH = "/"
